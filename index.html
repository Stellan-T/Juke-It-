<style>

:root{
  --ink:#1C1848;
  --sky:#27B4F5; --grape:#8B3FE3; --bubble:#F2437F; --sun:#FFBE1A; --blaze:#FF5B1F; --mint:#22C993; --indigo:#5B5BF0; --lime:#8FD13A;
  --bg:#EEE8FF; --dot:#D6CCFA; --surface:#FFFFFF; --surface-2:#F5F1FF;
  --text:#1C1848; --muted:#57528A; --line:#1C1848; --rim:#FFFFFF; --shadow:#1C1848; --slot:#8F86C9;
  --display:"Fredoka","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Rubik",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161339; --dot:#27225C; --surface:#27215F; --surface-2:#211C52;
    --text:#F5F2FF; --muted:#BDB6EA; --line:#0B0924; --rim:#F5F2FF; --shadow:#07051A; --slot:#6B62C4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161339; --dot:#27225C; --surface:#27215F; --surface-2:#211C52;
  --text:#F5F2FF; --muted:#BDB6EA; --line:#0B0924; --rim:#F5F2FF; --shadow:#07051A; --slot:#6B62C4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);color:var(--text);font-size:1rem;line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:22px 22px;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--display);line-height:1.08;margin:0}
.app{max-width:620px;margin:0 auto;padding:0 1rem 1.5rem}

/* shared */
.sticker{background:var(--surface);border:3px solid var(--line);border-radius:22px;box-shadow:0 0 0 4px var(--rim),6px 8px 0 4px var(--shadow)}
.btn{
  --b:var(--surface);--c:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:var(--display);font-weight:600;font-size:1.1rem;text-decoration:none;text-align:center;
  padding:.75rem 1.4rem;min-height:52px;border-radius:999px;cursor:pointer;
  background:var(--b);color:var(--c);border:3px solid var(--line);box-shadow:4px 5px 0 var(--shadow);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translate(-1px,-2px);box-shadow:5px 7px 0 var(--shadow)}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{--b:var(--surface-2)!important;--c:var(--muted)!important;border-style:dashed;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{--b:var(--bubble);--c:#fff}

.mtop output{flex:none;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
input.pct{
  -webkit-appearance:none;appearance:none;width:100%;height:16px;margin:0;border-radius:8px;border:3px solid var(--line);cursor:pointer;
  background:linear-gradient(to right,var(--bubble) 0 var(--v),var(--surface-2) var(--v) 100%);
}
input.pct::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sun);border:3px solid var(--line);box-shadow:2px 3px 0 var(--shadow)}
input.pct::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--sun);border:3px solid var(--line);box-shadow:2px 3px 0 var(--shadow)}
input.pct:focus-visible{outline:3px solid var(--sky);outline-offset:4px}
.decksum{margin-top:1.2rem;padding:.8rem 1rem;border-radius:14px;border:2px dashed var(--line);background:var(--surface-2);display:grid;gap:.25rem}
.decksum b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.decksum span{font-size:.9rem;color:var(--muted)}
.decksum .warn{color:var(--bubble);font-weight:600}

</style>
</head>

/* =====================================================================
   Spotify login (Authorization Code with PKCE, no server needed)
   ===================================================================== */
function b64url(buf){let s="";new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rand(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a).slice(0,n)}
async function login(){
  const v=rand(64);
  const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)));
  const st=rand(16);ls.set(K.ver,v);ls.set(K.state,st);
  const p=new URLSearchParams({response_type:"code",client_id:cfg.clientId,scope:SCOPES,code_challenge_method:"S256",code_challenge:ch,redirect_uri:REDIRECT,state:st});
  location.href=ACC+"/authorize?"+p;
}
async function tokenReq(params){
  const r=await fetch(ACC+"/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(params)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(params.grant_type==="refresh_token"){tok=null;ls.del(K.tok);S.screen="connect"}
    throw new Error(j.error_description||j.error||("Spotify login failed ("+r.status+")"));
  }
  tok={access:j.access_token,refresh:j.refresh_token||(tok&&tok.refresh),exp:Date.now()+(j.expires_in-60)*1000};
  ls.set(K.tok,tok);
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search);
  if(!q.has("code")&&!q.has("error"))return;
  history.replaceState(null,"",REDIRECT);
  if(q.get("error"))throw new Error(q.get("error")==="access_denied"?"Spotify login was cancelled.":"Spotify login failed: "+q.get("error"));
  if(q.get("state")!==ls.get(K.state))throw new Error("The login check didn't match. Log in again.");
  await tokenReq({grant_type:"authorization_code",code:q.get("code"),redirect_uri:REDIRECT,client_id:cfg.clientId,code_verifier:ls.get(K.ver)});
}
let refreshing=null;
async function ensureToken(){
  if(!tok){S.screen="connect";throw new Error("Log in with Spotify first.")}
  if(Date.now()<tok.exp)return;
  refreshing=refreshing||tokenReq({grant_type:"refresh_token",refresh_token:tok.refresh,client_id:cfg.clientId}).finally(()=>{refreshing=null});
  await refreshing;
}
class ApiErr extends Error{constructor(status,msg,reason){super(msg);this.status=status;this.reason=reason}}
async function api(path,opt={},retry=true){
  await ensureToken();
  const url=path.startsWith("http")?path:API+path;
  const headers={Authorization:"Bearer "+tok.access};
  if(opt.body)headers["Content-Type"]="application/json";
  let r;
  try{r=await fetch(url,{method:opt.method||"GET",headers,body:opt.body?JSON.stringify(opt.body):undefined})}
  catch(e){throw new Error("Can't reach Spotify. Check the internet connection.")}
  if(r.status===401&&retry){tok.exp=0;return api(path,opt,false)}
  if(r.status===429&&retry){await sleep(Math.min(((+r.headers.get("Retry-After"))||3)*1000,15000));return api(path,opt,false)}
  if(r.status===204||r.status===202)return null;
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=j&&j.error;throw new ApiErr(r.status,(e&&e.message)||("Spotify error "+r.status),e&&e.reason)}
  return j;
}

async function loadMe(){S.me=await api("/me")}
async function loadPlaylists(){
  const out=[];let url="/me/playlists?limit=50";
  while(url&&out.length<500){
    const j=await api(url);
    (j.items||[]).forEach(p=>{
      if(!p)return;
      const own=!!(p.owner&&S.me&&p.owner.id===S.me.id);
      const total=(p.items&&typeof p.items.total==="number")?p.items.total:(p.tracks&&typeof p.tracks.total==="number")?p.tracks.total:null;
      out.push({id:p.id,name:p.name,total,readable:own||!!p.collaborative,own,img:p.images&&p.images.length?p.images[p.images.length-1].url:null});
    });
    url=j.next;
  }
  S.playlists=out;
}
function trackObj(t){
  const rd=(t.album&&t.album.release_date)||"";const imgs=(t.album&&t.album.images)||[];
  return{id:t.id,uri:t.uri,t:t.name,a:(t.artists||[]).map(x=>x.name).join(", "),a1:(t.artists&&t.artists[0]&&t.artists[0].name)||"",
    sy:parseInt(rd.slice(0,4),10)||null,img:(imgs[1]||imgs[0]||{}).url||null};
}
async function readTracks(id){
  const out=[];let url=`/playlists/${id}/items?limit=50&market=from_token`;
  while(url){
    let j;
    try{j=await api(url)}
    catch(e){if(e.status===403||e.status===404)throw new Error("Spotify won't share that playlist. Only playlists you made yourself, or ones you were invited to as a collaborator, can be used.");throw e}
    (j.items||[]).forEach(e=>{
      const t=e&&(e.item||e.track);
      if(!t||t.type!=="track"||t.is_local||!t.id||t.is_playable===false)return;
      out.push(trackObj(t));
    });
    url=j.next;
  }
  return out;
}
function parsePlaylistId(s){
  s=String(s||"").trim();
  let m=s.match(/playlist[\/:]([A-Za-z0-9]{22})/);if(m)return m[1];
  m=s.match(/^([A-Za-z0-9]{22})$/);return m?m[1]:null;
}
async function loadDevices(){
  const j=await api("/me/player/devices");
  S.devices=(j&&j.devices)||[];
  if(!cfg.device||!S.devices.some(d=>d.id===cfg.device)){
    const pick=S.devices.find(d=>d.is_active)||S.devices.find(d=>d.type==="Smartphone")||S.devices[0];
    if(pick){cfg.device=pick.id;cfg.deviceName=pick.name;saveCfg()}
  }
}

/* =====================================================================
   Release years: Spotify often gives the remaster or compilation year,
   so each song is double-checked against MusicBrainz (free, 1 lookup/sec).
   ===================================================================== */
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"");
function cleanTitle(t){
  let s=String(t||"").split(" - ")[0];
  s=s.replace(/\s*[\(\[][^\)\]]*\b(remaster(ed)?|version|edit|mono|stereo|feat\.?|ft\.?|with|from|mix|single|deluxe|anniversary|bonus)\b[^\)\]]*[\)\]]/gi,"");
  return s.trim()||String(t||"");
}
let mbChain=Promise.resolve();
function checkYear(song){
  if(!song)return Promise.resolve(null);
  if(years[song.id])return Promise.resolve(years[song.id].y);
  const p=mbChain.then(async()=>{
    if(years[song.id])return years[song.id].y;
    let y=song.sy,src="spotify";
    try{
      const q=`recording:"${cleanTitle(song.t).replace(/["\\]/g,"")}" AND artist:"${song.a1.replace(/["\\]/g,"")}"`;
      const r=await fetch("https://musicbrainz.org/ws/2/recording?fmt=json&limit=25&query="+encodeURIComponent(q),{headers:{Accept:"application/json"}});
      if(r.ok){
        const j=await r.json(),nt=norm(cleanTitle(song.t)),na=norm(song.a1);let best=null;
        (j.recordings||[]).forEach(rec=>{
          if((rec.score||0)<70||norm(rec.title)!==nt)return;
          const credit=(rec["artist-credit"]||[]).map(c=>norm(c.name||(c.artist&&c.artist.name))).join("|");
          if(!na||!credit.includes(na))return;
          if(/live|demo|remix|karaoke|instrumental|acoustic|cover/i.test(rec.disambiguation||"")&&!/live/i.test(song.t))return;
          const yy=parseInt(String(rec["first-release-date"]||"").slice(0,4),10);
          if(yy>=1900&&(!best||yy<best))best=yy;
        });
        if(best&&(!y||best<y)){y=best;src="musicbrainz"}
      }
    }catch(e){}
    if(!y)y=song.sy;
    years[song.id]={y,src};ls.set(K.years,years);
    return y;
  });
  mbChain=p.then(()=>sleep(1100),()=>sleep(1100));
  return p;
}
function yearOf(id){const g=G();return(years[id]&&years[id].y)||(g&&g.songs[id]&&g.songs[id].sy)||0}
function prefetch(){const g=G();if(!g)return;g.deck.slice(-3).reverse().forEach(id=>checkYear(g.songs[id]))}

/* =====================================================================
   Face-down sensor + keep screen awake
   ===================================================================== */
const ori={listening:false,ok:false,down:false,since:0,asked:null,firing:false};
function askMotion(){
  if(ori.asked)return ori.asked;
  const D=window.DeviceOrientationEvent;
  if(D&&typeof D.requestPermission==="function"){
    ori.asked=D.requestPermission().then(r=>{if(r==="granted")listenMotion()}).catch(()=>{});
  }else{listenMotion();ori.asked=Promise.resolve()}
  return ori.asked;
}
function listenMotion(){
  if(ori.listening)return;ori.listening=true;
  window.addEventListener("deviceorientation",e=>{
    if(e.beta==null)return;
    const first=!ori.ok;ori.ok=true;
    const down=Math.abs(e.beta)>150,now=Date.now();
    if(down!==ori.down){ori.down=down;ori.since=now}
    if(first&&S.screen==="game"&&G()&&G().phase==="flip")render();
    const g=G();
    if(g&&S.screen==="game"&&g.phase==="flip"&&!g.count&&ori.down&&now-ori.since>450&&!ori.firing)startSong();
  });
}
let wl=null;
async function wake(){try{if("wakeLock" in navigator&&!wl&&document.visibilityState==="visible"){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.screen==="game")wake()});

async function startSong(){
  if(ori.firing)return;ori.firing=true;
  try{await playCurrent();G().phase="guess";say("Song is playing")}
  catch(e){S.error=e.message}
  finally{ori.firing=false;render()}
}
function enterFlip(){const g=G();g.phase="flip";g.flipAt=Date.now();if(!ori.ok)setTimeout(()=>{if(G()&&G().phase==="flip")render()},2600)}
let countTimer=null;
function countdown(){
  const g=G();g.count=3;render();
  clearInterval(countTimer);
  countTimer=setInterval(()=>{
    g.count--;
    if(g.count<=0){clearInterval(countTimer);g.count=0;startSong()}else render();
  },1000);
}

/* =====================================================================
   Sound effects (skipped while the song plays)
   ===================================================================== */
let ac=null;
function tones(seq){
  if(cfg.muted)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
    const now=ac.currentTime;
    seq.forEach(([f,t,d,type,vol])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(.0001,now+t);g.gain.exponentialRampToValueAtTime(vol||.16,now+t+.02);g.gain.exponentialRampToValueAtTime(.0001,now+t+d);
      o.connect(g).connect(ac.destination);o.start(now+t);o.stop(now+t+d+.05)});
  }catch(e){}
}
const SFX={
  tap:()=>tones([[660,0,.07]]),
  good:()=>tones([[523,0,.14],[659,.09,.14],[784,.18,.3]]),
  bad:()=>tones([[196,0,.25,"sawtooth",.07],[147,.16,.4,"sawtooth",.07]]),
  coin:()=>tones([[988,0,.08,"square",.06],[1319,.07,.22,"square",.06]]),
  juke:()=>tones([[392,0,.1,"square",.07],[523,.08,.1,"square",.07],[392,.16,.1,"square",.07],[659,.24,.25,"square",.07]]),
  win:()=>tones([[523,0,.15],[659,.13,.15],[784,.26,.15],[1047,.39,.5],[784,.55,.12],[1047,.66,.6]])
};

/* =====================================================================
   Game rules
   ===================================================================== */
function fits(tl,i,y){const L=tl[i-1],R=tl[i];return(L===undefined||yearOf(L)<=y)&&(R===undefined||y<=yearOf(R))}
function sortedIndex(tl,y){const i=tl.findIndex(id=>yearOf(id)>y);return i<0?tl.length:i}
function insertSorted(tl,id){tl.splice(sortedIndex(tl,yearOf(id)),0,id)}

function pctOf(p){return p&&typeof p.pct==="number"?p.pct:100}
function estOf(p){const pc=pctOf(p);if(!pc)return 0;return p.total!=null?Math.max(1,Math.round(p.total*pc/100)):null}
function deckEstimate(){
  let n=0,unknown=false;
  Object.values(S.setup.picked).forEach(p=>{const e=estOf(p);if(e===null)unknown=true;else n+=e});
  return{n,unknown};
}
function mixSummary(){
  const {n,unknown}=deckEstimate(),players=S.setup.players.length,need=players+10;
  let h=`<b>Deck: about ${n}${unknown?"+":""} songs</b>`;
  if(!unknown&&n<need)h+=`<span class="warn">That's too few. You need at least ${need} songs for ${players} players.</span>`;
  else if(!unknown&&n<players*cfg.goal)h+=`<span>The deck may run out before anyone reaches ${cfg.goal} cards. That's fine: the longest timeline wins then.</span>`;
  else h+=`<span>Duplicates across playlists are removed, so the final deck can be a little smaller.</span>`;
  return h;
}
function startLabel(){
  const act=Object.values(S.setup.picked).filter(p=>pctOf(p)>0);
  if(!act.length)return{on:false,text:Object.keys(S.setup.picked).length?"Turn up at least one playlist":"Pick a playlist to start"};
  const {n,unknown}=deckEstimate();
  return{on:true,text:`Start game with about ${n}${unknown?"+":""} songs`};
}
function mixOut(p){const e=estOf(p);return `${pctOf(p)}%`+(p.total!=null?`, ${e} of ${p.total} songs`:"")}
async function buildSongs(){
  const ids=Object.keys(S.setup.picked).filter(id=>pctOf(S.setup.picked[id])>0);
  const songs={},seen=new Set();
  for(let i=0;i<ids.length;i++){
    const pl=S.setup.picked[ids[i]];
    S.busy=`Reading “${pl.name}” (${i+1} of ${ids.length})`;render();
    const own={};
    (await readTracks(ids[i])).forEach(t=>{if(t.sy&&!own[t.id])own[t.id]=t});
    const all=shuffle(Object.values(own));
    const take=all.slice(0,Math.max(1,Math.round(all.length*pctOf(pl)/100)));
    take.forEach(t=>{
      if(songs[t.id])return;
      const k=norm(cleanTitle(t.t))+"|"+norm(t.a1);if(seen.has(k))return;
      seen.add(k);songs[t.id]=t;
    });
  }
  return songs;
}
async function newGame(songs,playersIn){
  const players=playersIn.map((p,i)=>({name:(p.name||"").trim()||`Player ${i+1}`,color:PCOL[i%PCOL.length],timeline:[],tokens:START_TOKENS}));
  const deck=shuffle(Object.keys(songs));
  const need=players.length+10;
  if(deck.length<need)throw new Error(`Only ${deck.length} songs found. Pick more playlists: you need at least ${need} songs for ${players.length} players.`);
  S.game={songs,players,deck,turn:Math.floor(Math.random()*players.length),goal:cfg.goal,
    phase:"intro",current:null,pick:null,juker:null,jukePick:null,result:null,named:false,note:null,winner:null,endReason:null,playing:false,count:0,fixing:false,snap:null};
  const g=S.game;
  for(let i=0;i<players.length;i++){
    S.busy=`Checking release years (${i+1} of ${players.length})`;render();
    const id=g.deck.pop();await checkYear(g.songs[id]);players[i].timeline=[id];
  }
  S.busy=null;S.screen="game";wake();prefetch();SFX.good();
}
async function drawNext(){
  const g=G();
  if(!g.deck.length){endByDeck();return false}
  const id=g.deck[g.deck.length-1];
  if(!years[id]){S.busy="Checking the release year";render();await checkYear(g.songs[id]);S.busy=null}
  g.deck.pop();
  Object.assign(g,{current:id,pick:null,juker:null,jukePick:null,result:null,named:false,playing:false,count:0,fixing:false,snap:null,peek:false});
  prefetch();return true;
}
function endByDeck(){
  const g=G();let best=0;
  g.players.forEach((p,i)=>{const b=g.players[best];if(p.timeline.length>b.timeline.length||(p.timeline.length===b.timeline.length&&p.tokens>b.tokens))best=i});
  g.winner=best;g.endReason="deck";S.screen="win";pauseMusic();SFX.win();
}
function resolve(){
  const g=G(),P=g.players[g.turn],y=yearOf(g.current);
  g.snap=JSON.stringify(g.players);
  const ok=fits(P.timeline,g.pick,y);
  const r={ok,jukeOk:false,ghostAt:null};
  if(ok)P.timeline.splice(g.pick,0,g.current);
  else{
    r.ghostAt=sortedIndex(P.timeline,y);
    if(g.juker!==null&&fits(P.timeline,g.jukePick,y)){r.jukeOk=true;insertSorted(g.players[g.juker].timeline,g.current)}
  }
  g.result=r;g.phase="reveal";g.named=false;g.fixing=false;
  const w=g.players.findIndex(p=>p.timeline.length>=g.goal);
  g.winner=w>=0?w:null;g.endReason=w>=0?"goal":null;
  say(verdict().title);
}
function verdict(){
  const g=G(),P=g.players[g.turn],r=g.result,s=g.songs[g.current],y=yearOf(g.current),J=g.juker!==null?g.players[g.juker]:null;
  if(r.ok)return{kind:"good",ico:"✓",title:`${P.name} nailed it`,body:`${cleanTitle(s.t)} is from ${y}. The card stays on ${P.name}'s timeline.`+(J?` ${J.name}'s Juke missed, so those tokens are gone.`:"")};
  if(r.jukeOk)return{kind:"steal",ico:"!",title:`${J.name} juked it`,body:`${cleanTitle(s.t)} is from ${y}. ${P.name} had the wrong spot and ${J.name} had the right one, so the card goes to ${J.name}.`};
  return{kind:"bad",ico:"✕",title:"Wrong spot",body:`${cleanTitle(s.t)} came out in ${y}. The card is out of the game.`+(J?` ${J.name}'s Juke missed too.`:"")};
}

  device(d){const dv=(S.devices||[]).find(x=>x.id===d.v);cfg.device=d.v;cfg.deviceName=dv?dv.name:null;saveCfg()},
  intro(d){cfg.intro=+d.v;saveCfg()},
  resume(){const g=G();S.screen=g.winner!==null&&g.phase!=="reveal"?"win":"game";wake()},
  async toSetup(){
    S.screen="setup";S.busy="Loading your playlists";render();
    try{await loadPlaylists();await loadDevices()}finally{S.busy=null}
  },
  addPlayer(){if(S.setup.players.length<8)S.setup.players.push({name:""})},
  rmPlayer(d){if(S.setup.players.length>2)S.setup.players.splice(+d.i,1)},
  togglePl(d){const p=(S.playlists||[]).find(x=>x.id===d.id)||S.setup.picked[d.id];if(!p)return;if(S.setup.picked[d.id])delete S.setup.picked[d.id];else S.setup.picked[d.id]={id:p.id,name:p.name,total:p.total,pct:100}},
  async addLink(){
    const inp=document.getElementById("pllink"),id=parsePlaylistId(inp&&inp.value);
    if(!id){S.error="Paste a Spotify playlist link, like https://open.spotify.com/playlist/…";return}
    S.busy="Checking that playlist";render();
    try{
      const p=await api(`/playlists/${id}`);
      const own=p.owner&&S.me&&p.owner.id===S.me.id;
      if(!own&&!p.collaborative)throw new Error(`“${p.name}” belongs to someone else, and Spotify only lets this game read playlists you made or collaborate on. Ask the owner to invite you as a collaborator, or copy the songs into your own playlist.`);
      const total=(p.items&&p.items.total)||(p.tracks&&p.tracks.total)||null;
      S.setup.picked[id]={id,name:p.name,total,pct:100};
      if(S.playlists&&!S.playlists.some(x=>x.id===id))S.playlists.unshift({id,name:p.name,total,readable:true,img:p.images&&p.images.length?p.images[p.images.length-1].url:null});
    }finally{S.busy=null}
  },
  goal(d){cfg.goal=+d.v;saveCfg()},
  balance(){
    const ps=Object.values(S.setup.picked).filter(p=>p.total);
    if(!ps.length)return;
    const target=Math.min(...ps.map(p=>p.total));
    ps.forEach(p=>{p.pct=Math.max(1,Math.min(100,Math.round(target/p.total*100)))});
  },
  allFull(){Object.values(S.setup.picked).forEach(p=>{p.pct=100})},
  async start(){
    if(!startLabel().on){S.error="Pick at least one playlist and set it above 0%.";return}
    askMotion();
    try{const songs=await buildSongs();await newGame(songs,S.setup.players)}
    finally{S.busy=null}
  },
  async drawSong(){askMotion();wake();G().note=null;if(await drawNext())enterFlip()},
  countdown(){countdown()},
  async playNow(){await startSong()},
  async pause(){await pauseMusic()},
  async resumeSong(){await resumeMusic()},
  async replay(){await playCurrent()},
  async buy(){
    const g=G(),P=g.players[g.turn];if(P.tokens<COST.buy)return;
    if(!g.deck.length){endByDeck();return}
    const id=g.deck[g.deck.length-1];
    if(!years[id]){S.busy="Checking the release year";render();await checkYear(g.songs[id]);S.busy=null}
    g.deck.pop();P.tokens-=COST.buy;insertSorted(P.timeline,id);g.note={bought:id};SFX.coin();prefetch();
    if(P.timeline.length>=g.goal){g.winner=g.turn;g.endReason="goal";S.screen="win";SFX.win()}
  },
  async skip(){
    const g=G(),P=g.players[g.turn];if(P.tokens<COST.skip)return;
    P.tokens-=COST.skip;pauseMusic();
    if(await drawNext())enterFlip();
  },
  pick(d){const g=G();if(g.phase==="guess")g.pick=+d.i;else if(g.phase==="jukePick")g.jukePick=+d.i},
  lock(){const g=G();if(g.pick===null)return;if(g.players.some((p,i)=>i!==g.turn&&p.tokens>=COST.juke))g.phase="juke";else A.reveal()},
  jukeBy(d){const g=G();g.juker=+d.i;g.jukePick=null;g.phase="jukePick"},
  cancelJuke(){const g=G();g.juker=null;g.jukePick=null;g.phase="juke"},
  lockJuke(){const g=G();if(g.jukePick===null)return;g.players[g.juker].tokens-=COST.juke;A.reveal()},
  reveal(){resolve();const r=G().result;if(r.ok)SFX.good();else if(r.jukeOk)SFX.juke();else SFX.bad()},
  named(){const g=G(),P=g.players[g.turn];if(g.named||P.tokens>=MAX_TOKENS)return;P.tokens++;g.named=true;SFX.coin()},
  fixOpen(){G().fixing=true},
  fixCancel(){G().fixing=false},
  peek(){G().peek=!G().peek},
  fixSave(){
    const g=G(),v=parseInt(document.getElementById("fixy").value,10),now=new Date().getFullYear();
    if(!(v>=1900&&v<=now)){S.error=`Enter a year between 1900 and ${now}.`;return}
    years[g.current]={y:v,src:"you"};ls.set(K.years,years);
    g.players=JSON.parse(g.snap);resolve();
  },
  next(){
    const g=G();pauseMusic();
    if(g.winner!==null){S.screen="win";SFX.win();return}
    g.turn=(g.turn+1)%g.players.length;
    Object.assign(g,{phase:"intro",current:null,pick:null,juker:null,jukePick:null,result:null,note:null,playing:false,count:0,fixing:false,snap:null});
  },
  async rematch(){const g=G();await newGame(g.songs,g.players.map(p=>({name:p.name})))},
  quit(){pauseMusic();S.game=null;ls.del(K.game);S.screen="home"},
  dismiss(){S.error=null}
};

function timeline(mode){
  const g=G(),P=g.players[g.turn],tl=P.timeline;let h='<div class="tl">';
  const slot=i=>{
    if(mode==="guess"){const sel=g.pick===i;return `<button class="slot ${sel?"sel":""}" data-act="pick" data-i="${i}" aria-pressed="${sel}" aria-label="${slotLabel(tl,i)}">${sel?`<span class="mini-vinyl"></span>${esc(P.name)}'s guess`:slotLabel(tl,i)}</button>`}
    if(mode==="jukePick"){
      if(i===g.pick)return `<div class="slot lock">${esc(P.name)}'s guess</div>`;
      const sel=g.jukePick===i,J=g.players[g.juker];
      return `<button class="slot juke ${sel?"sel":""}" data-act="pick" data-i="${i}" aria-pressed="${sel}" aria-label="${slotLabel(tl,i)}">${sel?`<span class="mini-vinyl"></span>${esc(J.name)}'s Juke`:slotLabel(tl,i)}</button>`;
    }
    if(mode==="juke"&&i===g.pick)return `<div class="slot lock">${esc(P.name)}'s guess</div>`;
    return "";
  };
  if(mode==="reveal"){
    const r=g.result,ghost=()=>cardRow(g.current,"miss",r.jukeOk?"Stolen":"Out");
    tl.forEach((id,i)=>{if(!r.ok&&r.ghostAt===i)h+=ghost();const isNew=r.ok&&id===g.current;h+=cardRow(id,isNew?"new":"",isNew?"New":"")});
    if(!r.ok&&r.ghostAt===tl.length)h+=ghost();
  }else{
    tl.forEach((id,i)=>{const b=g.note&&g.note.bought===id;h+=slot(i)+cardRow(id,b?"new":"",b?"Bought":"")});
    h+=slot(tl.length);
  }
  return h+"</div>";
}

    const sensor=ori.ok,waiting=!ori.ok&&ori.listening&&Date.now()-(g.flipAt||0)<2500;
    body=`<div class="flip sticker" style="--pc:${P.color}">
      ${g.count?`<h2>Put it down now</h2><div class="count" aria-live="assertive">${g.count}</div><p>The song starts at zero.</p>`:`
      <span class="sensor ${sensor?"":"off"}"><i></i>${sensor?"Flip sensor ready":waiting?"Looking for the flip sensor":"No flip sensor on this device"}</span>
      <div class="phone3d" aria-hidden="true"><div class="phone"></div></div>
      <h2>${sensor?"Flip the phone face-down":"Get ready to put it down"}</h2>
      <p>${sensor?"The song starts as soon as the screen touches the table. Nobody sees what's playing.":"Tap the countdown, then put the phone face-down before it hits zero."}</p>
      <div class="acts">
        <button class="btn ${sensor?"":"btn-primary"}" data-act="countdown">Play after a 3-second countdown</button>
        <button class="link" data-act="playNow">Play now (for a speaker across the room)</button>
      </div>`}
    </div>
    <p class="say">${esc(P.name)}'s timeline</p>${timeline("view")}`;
  }else if(g.phase==="guess"){
    body=`${cabinet()}
      <p class="say">${esc(P.name)}, where does it fit?</p>
      <p class="sub">Tap a gap on your timeline, then lock it in. Name the artist and title out loud for a bonus token.</p>
      ${timeline("guess")}
      <div class="sticky-act"><button class="btn btn-primary" data-act="lock" ${g.pick===null?"disabled":""}>Lock it in</button></div>`;
  }else if(g.phase==="juke"){
    const el=g.players.map((p,i)=>({p,i})).filter(o=>o.i!==g.turn&&o.p.tokens>=COST.juke);
    body=`${cabinet()}
      <div class="juke sticker"><h2>Anyone want to Juke?</h2>
        <p>Think ${esc(P.name)} got it wrong? A Juke costs 2 tokens. Pick where it really goes. If ${esc(P.name)} is wrong and you're right, you steal the card.</p>
        <div class="jukers">${el.map(o=>`<button class="btn btn-small jbtn" style="--pc:${o.p.color}" data-act="jukeBy" data-i="${o.i}">${esc(o.p.name)} jukes</button>`).join("")}</div>
      </div>${timeline("juke")}
      <div class="sticky-act"><button class="btn btn-primary" data-act="reveal">No Juke, reveal it</button></div>`;
  }else if(g.phase==="jukePick"){
    const J=g.players[g.juker];
    body=`${cabinet()}
      <p class="say">${esc(J.name)}, where does it really go?</p><p class="sub">Tap a different gap on ${esc(P.name)}'s timeline.</p>
      ${timeline("jukePick")}
      <div class="sticky-act"><button class="btn" data-act="cancelJuke">Cancel Juke</button><button class="btn btn-primary" data-act="lockJuke" ${g.jukePick===null?"disabled":""}>Lock in the Juke</button></div>`;
  }else if(g.phase==="reveal"){
    const v=verdict(),full=P.tokens>=MAX_TOKENS,nextName=g.players[(g.turn+1)%g.players.length].name;
    body=`${cabinet()}
      <div class="verdict sticker ${v.kind}"><span class="ico" aria-hidden="true">${v.ico}</span>
        <div><h2>${esc(v.title)}</h2><p>${esc(v.body)}</p>
          <div class="bonus">${g.named?`<span class="muted">+1 token for naming it.</span>`:full?`<span class="muted">${esc(P.name)}'s token pouch is full (5).</span>`:`<button class="btn btn-small btn-sun" data-act="named">${esc(P.name)} named it: +1 token</button>`}</div>
          ${g.fixing?`<div class="fix"><label for="fixy">Real year</label><input id="fixy" inputmode="numeric" maxlength="4" value="${yearOf(g.current)}"><button class="btn btn-small" data-act="fixSave">Save and re-check</button><button class="link" data-act="fixCancel">Cancel</button></div>`
                    :`<p class="yr-src"><button class="link" style="padding:0" data-act="fixOpen">Year wrong? Fix it</button></p>`}
        </div></div>
      <p class="say">${esc(P.name)}'s timeline</p>${timeline("reveal")}
      <div class="sticky-act"><button class="btn btn-primary" data-act="next">${g.winner!==null?"See who won":`Next turn: ${esc(nextName)}`}</button></div>`;
  }
  return topbar()+scoreboard()+body;
}
function vWin(){
  const g=G(),W=g.players[g.winner];
  const order=g.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.timeline.length-a.p.timeline.length||b.p.tokens-a.p.tokens);
  const why=g.endReason==="deck"?`The deck ran out, and ${esc(W.name)} had the longest timeline.`:`First to ${g.goal} cards.`;
  return `${topbar()}<div class="win" style="--pc:${W.color}">
    <div class="trophy" aria-hidden="true"><svg viewBox="0 0 24 24" width="64" height="64" fill="#fff" stroke="#1C1848" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/><circle cx="12" cy="15" r="1.6" fill="#F2437F"/></svg></div>
    <h1>${esc(W.name)} wins!</h1><p class="why">${why}</p>
    <ol class="standings sticker" style="list-style:none">${order.map((o,k)=>`<li style="--pc:${o.p.color}"><span class="pl">${k+1}</span><span class="n"><i></i>${esc(o.p.name)}</span><span>${o.p.timeline.length} card${o.p.timeline.length===1?"":"s"}</span></li>`).join("")}</ol>
    <h3>${esc(W.name)}'s winning timeline</h3>
    <div class="tl">${W.timeline.map(id=>cardRow(id)).join("")}</div>
    <div class="acts"><button class="btn btn-primary" data-act="rematch">Rematch</button><button class="btn" data-act="quit">Main menu</button></div>
  </div>`;
}
function vLoading(){return `<div class="busy"><div><div class="vinyl"></div><p>Loading</p></div></div>`}

/* =====================================================================
   Rules sheet + confetti
   ===================================================================== */
function openRules(){
  const el=document.getElementById("sheet");
  el.innerHTML=`<div class="sheet-wrap" data-close="1"><div class="sheet sticker" role="dialog" aria-modal="true" aria-labelledby="rt">
    <h2 id="rt">How to play</h2><ol>
      <li>Everyone starts with <b>one song card</b> face up and <b>2 tokens</b>.</li>
      <li>On your turn, tap Draw a song and <b>put the phone face-down</b>. The song starts playing, and nobody can see what it is.</li>
      <li>Pick the phone up again and place the song on your timeline: before, between or after your cards. <b>Right spot, you keep it.</b> Wrong spot, it's out.</li>
      <li>Name the artist and title out loud for <b>+1 token</b>. You can hold up to 5.</li>
      <li><b>Skip</b> (1 token): swap the song for a new one.</li>
      <li><b>Juke</b> (2 tokens): after someone locks in, another player can pick a different spot. If the placer is wrong and the juker is right, the juker steals the card.</li>
      <li><b>Buy a card</b> (3 tokens): a free card goes straight onto your timeline.</li>
      <li>Songs from the same year fit on either side of each other. The year is when the song first came out, not the remaster.</li>
      <li>First to the target number of cards wins.</li>
    </ol><button class="btn btn-primary wide" data-close="1">Got it</button></div></div>`;
  el.querySelector(".sheet .btn").focus();
}
document.getElementById("sheet").addEventListener("click",e=>{if(e.target.dataset&&e.target.dataset.close)document.getElementById("sheet").innerHTML=""});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("sheet").innerHTML=""});
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("fx"),x=c.getContext("2d");c.hidden=false;
  const dpr=Math.min(2,window.devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=["#27B4F5","#8B3FE3","#F2437F","#FFBE1A","#FF5B1F","#22C993"];
  const P=Array.from({length:160},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t-t0<4200)requestAnimationFrame(f);else{x.clearRect(0,0,innerWidth,innerHeight);c.hidden=true}})(t0);
}

/* =====================================================================
   Render loop
   ===================================================================== */
const app=document.getElementById("app");
let lastKey="";
function render(){
  const g=G();
  if((S.screen==="game"||S.screen==="win")&&!g)S.screen=S.me?"home":"connect";
  const v={connect:vConnect,home:vHome,settings:vSettings,setup:vSetup,game:vGame,win:vWin,loading:vLoading}[S.screen]||vHome;
  app.innerHTML=v()+(S.busy?`<div class="busy" role="status"><div><div class="vinyl"></div><p>${esc(S.busy)}</p></div></div>`:"");
  const key=S.screen+"|"+(g?g.turn+":"+g.phase:"");
  if(key!==lastKey){window.scrollTo({top:0});if(S.screen==="win")confetti()}
  lastKey=key;
  if(g)saveGame();else ls.set(K.setup,S.setup);
}
let running=false;
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled||running)return;
  const fn=A[b.dataset.act];if(!fn)return;
  if(b.dataset.act!=="dismiss")S.error=null;
  if(b.dataset.act!=="copyUri")S.copied=false;
  running=true;
  try{await fn(b.dataset)}catch(err){S.busy=null;S.error=err&&err.message?err.message:"Something went wrong. Try again."}
  finally{running=false;render()}
});
app.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.pct!==undefined){
    const p=S.setup.picked[el.dataset.pct];if(!p)return;
    p.pct=+el.value;el.style.setProperty("--v",p.pct+"%");
    const o=document.getElementById("mo-"+p.id);if(o)o.textContent=mixOut(p);
    const ds=document.getElementById("decksum");if(ds)ds.innerHTML=mixSummary();
    const sb=document.getElementById("startbtn");if(sb){const sl=startLabel();sb.textContent=sl.text;sb.disabled=!sl.on}
    ls.set(K.setup,S.setup);return;
  }
  const i=el.dataset.name;if(i===undefined)return;S.setup.players[+i].name=el.value;ls.set(K.setup,S.setup);
});

(async function init(){
  render();
  try{await handleRedirect();await A.boot()}
  catch(e){S.busy=null;S.error=e.message;if(!S.me)S.screen="connect"}
  render();
})();
})();
</script>
